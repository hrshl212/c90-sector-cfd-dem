<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Quarter-turn rotational mapping</title>
  <desc id="description">A full circular domain divided into four quadrants, with the upper-right C90 sector highlighted and arrows identifying its two radial faces by a ninety-degree rotation.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <g transform="translate(290 280)">
    <path d="M 0 0 L 0 -210 A 210 210 0 0 1 210 0 Z" fill="#cfe8f3" stroke="#0072b2" stroke-width="4"/>
    <path d="M 0 -210 A 210 210 0 1 1 -0.1 -210" fill="none" stroke="#404040" stroke-width="3"/>
    <line x1="-210" y1="0" x2="210" y2="0" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="0" y1="-210" x2="0" y2="210" stroke="#8a8a8a" stroke-width="2"/>
    <path d="M 18 -155 A 156 156 0 0 1 155 -18" fill="none" stroke="#d55e00" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="115" cy="-92" r="10" fill="#0072b2"/>
    <circle cx="92" cy="115" r="8" fill="#ffffff" stroke="#0072b2" stroke-width="4" stroke-dasharray="5 4"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d55e00"/>
    </marker>
  </defs>
  <g font-family="sans-serif" fill="#252525">
    <text x="535" y="95" font-size="30" font-weight="600">C90 canonical sector</text>
    <text x="535" y="145" font-size="22">Scalar: q(Rx) = q(x)</text>
    <text x="535" y="185" font-size="22">Vector: u(Rx) = R u(x)</text>
    <text x="535" y="245" font-size="22">Rotated copies represent</text>
    <text x="535" y="278" font-size="22">the full cylinder.</text>
    <text x="535" y="350" font-size="20" fill="#d55e00">90° face identification</text>
    <text x="535" y="400" font-size="20" fill="#0072b2">● real particle</text>
    <text x="535" y="438" font-size="20" fill="#0072b2">○ rotational image</text>
  </g>
</svg>
